name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      # The examples run during the build, and most need the MNE sample dataset.
      - uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: mne-sample-data
      - run: uv run python -c "import mne; mne.datasets.sample.data_path(update_path=True)"
      # The overview example draws brains with PyVista, which needs a display.
      - uses: pyvista/setup-headless-display-action@v3
      - run: uv run sphinx-build -b html docs/source docs/build/html --keep-going
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages needs a public repository on the free plan.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

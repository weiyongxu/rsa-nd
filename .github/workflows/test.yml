name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual runs

jobs:
  # The pre-commit hooks: ruff, codespell and file checks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no major-version tags since v8, so pin a release.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # All tests, with the newest Python and the versions in uv.lock. The slow
  # tests compare results with mne-rsa on the MNE sample dataset. The cache
  # holds only the sample data; the docs workflow has its own, larger cache.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags so hatch-vcs can derive the version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync
      - uses: actions/cache@v6
        with:
          path: ~/mne_data
          key: mne-sample-data
      - run: uv run python -c "import mne; mne.datasets.sample.data_path(update_path=True)"
      - run: uv run pytest tests/ --cov=rsa_nd --cov-report=term-missing

  # The fast tests with the oldest Python and MNE that rsa-nd supports.
  oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
      - run: uv sync
      - run: uv pip install mne==1.8.0
      - run: uv run --no-sync pytest tests/ -m "not slowtest"

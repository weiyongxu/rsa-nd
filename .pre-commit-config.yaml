# Run `uv run pre-commit install` once to enable these hooks on commit.
# Keep the ruff and codespell versions equal to those in uv.lock, so the hooks
# and CI format and check alike.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check     # lint
        args: ["--fix"]
      - id: ruff-format    # format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]  # read [tool.codespell] on py<3.11

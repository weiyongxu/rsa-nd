[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rsa-nd"
dynamic = ["version"]
description = "Representational similarity analysis over any EEG/MEG features and dimensions, built on MNE-Python and mne-rsa"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"

authors = [
  { name = "Weiyong Xu", email = "weiyong.w.xu@jyu.fi" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

keywords = [
  "mne",
  "eeg",
  "meg",
  "neuroimaging",
  "rsa",
  "representational-similarity-analysis",
  "searchlight",
  "time-frequency",
]

dependencies = [
  "mne>=1.8",
  # rsa-nd uses the private mne_rsa.source_level._get_distance_matrix, so that
  # source searchlights match mne-rsa exactly. The upper bound stops a future
  # major release from breaking installed copies.
  "mne-rsa>=1.0,<2",
  "numpy",
  "scipy",
  "h5io",
]

[project.urls]
Homepage = "https://github.com/weiyongxu/rsa-nd"
Documentation = "https://weiyongxu.github.io/rsa-nd/"
"Issue Tracker" = "https://github.com/weiyongxu/rsa-nd/issues"
"Source Code" = "https://github.com/weiyongxu/rsa-nd"

# Dev tools: installed by default with `uv sync`
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff",
  "codespell",
  "pre-commit",
  "sphinx>=8.1.3",
  "furo>=2025.9.25",
  "sphinx-gallery>=0.20.0",
  "pillow>=12.0.0",
  "pandas>=2.3.3",  # for mne.datasets.limo, in the group example
]

# mne-rsa pulls pyside6; >=6.10 only ships manylinux_2_34 wheels, which
# do not install on older glibc (manylinux_2_28) Linux hosts. Constrain to
# the 6.9.x line, which has compatible wheels, without touching the
# declared mne-rsa dependency.
[tool.uv]
constraint-dependencies = ["pyside6<6.10"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/rsa_nd"]

[tool.pytest.ini_options]
markers = [
  "slowtest: needs the MNE sample data (deselect with '-m \"not slowtest\"')",
]
# Deprecated calls fail the tests, so they are fixed before MNE or other
# dependencies remove them.
filterwarnings = [
  "error::DeprecationWarning",
  "error::FutureWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (catches common bugs)
    "UP",   # pyupgrade (modern Python syntax)
    "C90",  # mccabe complexity
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip() without strict= (too verbose for typical use)
]

[tool.ruff.lint.isort]
known-first-party = ["rsa_nd"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.codespell]
skip = "*.lock,*.svg,./.venv,./.git,./docs/build,./docs/source/auto_examples,./examples/output"
ignore-words-list = "trough"

[tool.coverage.run]
source = ["rsa_nd"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
